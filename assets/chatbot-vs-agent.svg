<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Left: Chatbot -->
  <rect x="30" y="30" width="440" height="380" rx="18" fill="#f6f8fc" stroke="#c9d6ef" stroke-width="2"/>
  <text x="58" y="84" font-size="28" font-weight="700" fill="#6b7a99">CHATBOT</text>
  <text x="58" y="112" font-size="18" fill="#8893a8">answers, then stops</text>
  <rect x="58" y="140" width="384" height="150" rx="16" fill="#ffffff" stroke="#c9d6ef" stroke-width="2"/>
  <path d="M104,290 L104,322 L136,290 Z" fill="#ffffff" stroke="#c9d6ef" stroke-width="2"/>
  <text x="84" y="186" font-size="21" fill="#1a1a1a">"Here are three flights</text>
  <text x="84" y="214" font-size="21" fill="#1a1a1a">you could book:</text>
  <text x="84" y="252" font-size="20" font-weight="700" fill="#0063AC">BA117, LX22, AF44"</text>
  <text x="58" y="360" font-size="20" fill="#6b7a99">You still have to book it.</text>

  <!-- Right: Agent -->
  <rect x="530" y="30" width="440" height="380" rx="18" fill="#e8f1f8" stroke="#0063AC" stroke-width="2.5"/>
  <text x="558" y="84" font-size="28" font-weight="700" fill="#0063AC">AGENT</text>
  <text x="558" y="112" font-size="18" fill="#2a5a8f">acts, step by step</text>

  <g font-size="20" fill="#1a1a1a">
    <rect x="558" y="140" width="384" height="44" rx="10" fill="#ffffff" stroke="#0063AC" stroke-width="1.5"/>
    <circle cx="585" cy="162" r="15" fill="#ffb020"/>
    <text x="585" y="168" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="612" y="168">Search flights</text>

    <rect x="558" y="200" width="384" height="44" rx="10" fill="#ffffff" stroke="#0063AC" stroke-width="1.5"/>
    <circle cx="585" cy="222" r="15" fill="#ffb020"/>
    <text x="585" y="228" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="612" y="228">Pick the cheapest</text>

    <rect x="558" y="260" width="384" height="44" rx="10" fill="#ffffff" stroke="#0063AC" stroke-width="1.5"/>
    <circle cx="585" cy="282" r="15" fill="#ffb020"/>
    <text x="585" y="288" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="612" y="288">Book it</text>

    <rect x="558" y="320" width="384" height="44" rx="10" fill="#ffffff" stroke="#0063AC" stroke-width="1.5"/>
    <circle cx="585" cy="342" r="15" fill="#ffb020"/>
    <text x="585" y="348" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="612" y="348">Email you the ticket</text>
    <path d="M906,342 l8,9 l16,-19" fill="none" stroke="#2e9e4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
