<svg viewBox="0 0 1000 530" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Level 1: LLM -->
  <rect x="30" y="280" width="176" height="160" rx="10" fill="#e8f1f8" stroke="#0063AC" stroke-width="2"/>
  <text x="118" y="318" font-size="30" font-weight="700" fill="#0063AC" text-anchor="middle">1</text>
  <text x="118" y="352" font-size="22" font-weight="700" fill="#0063AC" text-anchor="middle">LLM</text>
  <text x="118" y="384" font-size="16" fill="#3b4252" text-anchor="middle">text in,</text>
  <text x="118" y="406" font-size="16" fill="#3b4252" text-anchor="middle">text out</text>

  <!-- Level 2: Augmented LLM -->
  <rect x="222" y="230" width="176" height="210" rx="10" fill="#d3e5f3" stroke="#0063AC" stroke-width="2"/>
  <text x="310" y="268" font-size="30" font-weight="700" fill="#0063AC" text-anchor="middle">2</text>
  <text x="310" y="302" font-size="21" font-weight="700" fill="#0063AC" text-anchor="middle">Augmented LLM</text>
  <text x="310" y="334" font-size="16" fill="#3b4252" text-anchor="middle">+ search, files,</text>
  <text x="310" y="356" font-size="16" fill="#3b4252" text-anchor="middle">memory, a tool</text>

  <!-- Level 3: Workflow -->
  <rect x="414" y="180" width="176" height="260" rx="10" fill="#b4d2ec" stroke="#0063AC" stroke-width="2"/>
  <text x="502" y="218" font-size="30" font-weight="700" fill="#0063AC" text-anchor="middle">3</text>
  <text x="502" y="252" font-size="22" font-weight="700" fill="#0063AC" text-anchor="middle">Workflow</text>
  <text x="502" y="284" font-size="16" fill="#1a1a1a" text-anchor="middle">+ fixed steps that</text>
  <text x="502" y="306" font-size="16" fill="#1a1a1a" text-anchor="middle">a person designed</text>

  <!-- Level 4: Agent (highlighted) -->
  <rect x="606" y="130" width="176" height="310" rx="10" fill="#0063AC" stroke="#003f6e" stroke-width="4"/>
  <text x="694" y="168" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="694" y="202" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Agent</text>
  <text x="694" y="234" font-size="16" fill="#e8f1f8" text-anchor="middle">+ decides its own</text>
  <text x="694" y="256" font-size="16" fill="#e8f1f8" text-anchor="middle">steps, in a loop</text>

  <!-- Level 5: Multi-agent -->
  <rect x="798" y="80" width="176" height="360" rx="10" fill="#004e87" stroke="#003f6e" stroke-width="2"/>
  <text x="886" y="118" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="886" y="152" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Multi-agent</text>
  <text x="886" y="184" font-size="16" fill="#e8f1f8" text-anchor="middle">+ a team of agents</text>
  <text x="886" y="206" font-size="16" fill="#e8f1f8" text-anchor="middle">with different roles</text>

  <!-- Who decides the steps -->
  <path d="M30,462 L30,472 L590,472 L590,462" fill="none" stroke="#9aa7bd" stroke-width="2.5"/>
  <text x="310" y="502" font-size="19" fill="#5a6b80" text-anchor="middle">A <tspan font-weight="700" fill="#3b4252">person</tspan> decides the steps</text>
  <path d="M606,462 L606,472 L974,472 L974,462" fill="none" stroke="#0063AC" stroke-width="2.5"/>
  <text x="790" y="502" font-size="19" fill="#0063AC" text-anchor="middle">The <tspan font-weight="700">model</tspan> decides the steps</text>
</svg>
