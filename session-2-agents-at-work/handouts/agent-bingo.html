<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Bingo</title>
<style>
  :root { --blue: #0063AC; --ink: #1a1a1a; --muted: #5a6b80; --line: #dbe6f3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef2f7; color: var(--ink); font-family: 'Helvetica Neue', Arial, sans-serif; }
  .tip { max-width: 210mm; margin: 16px auto 0; padding: 0 4px; color: var(--muted); font-size: 14px; }
  .page { width: 210mm; height: 297mm; margin: 16px auto; background: #fff; padding: 12mm; display: flex; flex-direction: column; gap: 10mm; }
  .card { flex: 1; border: 3px solid var(--blue); border-radius: 16px; padding: 7mm; display: flex; flex-direction: column; }
  .card header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5mm; }
  .card h1 { margin: 0; color: var(--blue); font-size: 30px; letter-spacing: 1px; }
  .card .rule { font-size: 14px; color: var(--muted); }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 4mm; }
  .sq { border: 2px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 4mm; }
  .sq b { font-size: 21px; color: var(--blue); }
  .sq span { font-size: 13px; color: var(--muted); margin-top: 2mm; }
  .name { margin-top: 4mm; font-size: 14px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 3mm; }
  @media print {
    body { background: #fff; }
    .tip { display: none; }
    .page { margin: 0; page-break-after: always; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>
<p class="tip">Print (A4): 6 pages, 2 cards per page, 12 cards in different orders. Print more copies for a bigger room. Cut each page in half.</p>
<div id="pages"></div>
<script>
  const SQUARES = [
    ["Made a plan", "It wrote out its steps first"],
    ["Used a tool", "It read, wrote or ran something"],
    ["Hit an error", "Something did not work"],
    ["Tried again", "It changed course after a problem"],
    ["Asked permission", "It stopped to ask a human"],
    ["Checked its own work", "It tested or looked at its result"],
  ];
  const CARDS = 12;

  // Fixed-seed shuffle so every printout has the same 12 distinct cards.
  function seededShuffle(items, seed) {
    const copy = [...items];
    let s = seed;
    for (let i = copy.length - 1; i > 0; i--) {
      s = (s * 9301 + 49297) % 233280;
      const j = Math.floor((s / 233280) * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function cardHtml(index) {
    const squares = seededShuffle(SQUARES, index + 7)
      .map(([title, hint]) => `<div class="sq"><b>${title}</b><span>${hint}</span></div>`)
      .join("");
    return `<div class="card"><header><h1>AGENT BINGO</h1>
      <span class="rule">Tick a square when you spot it. Full row: shout "bingo!"</span></header>
      <div class="grid">${squares}</div><div class="name">Name:</div></div>`;
  }

  const container = document.getElementById("pages");
  for (let p = 0; p < CARDS / 2; p++) {
    const page = document.createElement("section");
    page.className = "page";
    page.innerHTML = cardHtml(p * 2) + cardHtml(p * 2 + 1);
    container.appendChild(page);
  }
</script>
</body>
</html>
