<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="s" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5,3 L0,6 Z" fill="#0063AC"/>
    </marker>
  </defs>

  <!-- Card 1: Routing -->
  <rect x="20" y="24" width="300" height="286" rx="16" fill="#f6f8fc" stroke="#c9d6ef" stroke-width="2"/>
  <rect x="20" y="24" width="300" height="8" rx="4" fill="#0063AC"/>
  <rect x="140" y="64" width="60" height="34" rx="8" fill="#e8f1f8" stroke="#0063AC" stroke-width="2"/>
  <line x1="170" y1="98" x2="100" y2="150" stroke="#0063AC" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="170" y1="98" x2="170" y2="150" stroke="#0063AC" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="170" y1="98" x2="240" y2="150" stroke="#0063AC" stroke-width="2.5" marker-end="url(#s)"/>
  <circle cx="92" cy="160" r="11" fill="#0063AC"/>
  <circle cx="170" cy="160" r="11" fill="#0063AC"/>
  <circle cx="248" cy="160" r="11" fill="#0063AC"/>
  <text x="170" y="222" font-size="21" font-weight="700" fill="#0063AC" text-anchor="middle">ROUTING</text>
  <text x="170" y="252" font-size="16" fill="#3b4252" text-anchor="middle">send each task to</text>
  <text x="170" y="274" font-size="16" fill="#3b4252" text-anchor="middle">the right helper</text>

  <!-- Card 2: Orchestrator + workers -->
  <rect x="350" y="24" width="300" height="286" rx="16" fill="#f6f8fc" stroke="#c9d6ef" stroke-width="2"/>
  <rect x="350" y="24" width="300" height="8" rx="4" fill="#0063AC"/>
  <rect x="470" y="60" width="60" height="32" rx="8" fill="#0063AC"/>
  <text x="500" y="81" font-size="13" fill="#ffffff" text-anchor="middle">manager</text>
  <line x1="500" y1="92" x2="430" y2="138" stroke="#0063AC" stroke-width="2.5"/>
  <line x1="500" y1="92" x2="500" y2="138" stroke="#0063AC" stroke-width="2.5"/>
  <line x1="500" y1="92" x2="570" y2="138" stroke="#0063AC" stroke-width="2.5"/>
  <rect x="405" y="138" width="50" height="30" rx="7" fill="#e8f1f8" stroke="#0063AC" stroke-width="2"/>
  <rect x="475" y="138" width="50" height="30" rx="7" fill="#e8f1f8" stroke="#0063AC" stroke-width="2"/>
  <rect x="545" y="138" width="50" height="30" rx="7" fill="#e8f1f8" stroke="#0063AC" stroke-width="2"/>
  <text x="500" y="222" font-size="19" font-weight="700" fill="#0063AC" text-anchor="middle">ORCHESTRATOR</text>
  <text x="500" y="252" font-size="16" fill="#3b4252" text-anchor="middle">a manager delegates</text>
  <text x="500" y="274" font-size="16" fill="#3b4252" text-anchor="middle">to specialists</text>

  <!-- Card 3: Evaluator + optimizer -->
  <rect x="680" y="24" width="300" height="286" rx="16" fill="#f6f8fc" stroke="#c9d6ef" stroke-width="2"/>
  <rect x="680" y="24" width="300" height="8" rx="4" fill="#0063AC"/>
  <rect x="745" y="70" width="74" height="34" rx="8" fill="#e8f1f8" stroke="#0063AC" stroke-width="2"/>
  <text x="782" y="92" font-size="14" fill="#0063AC" text-anchor="middle">make</text>
  <rect x="845" y="70" width="74" height="34" rx="8" fill="#e8f1f8" stroke="#0063AC" stroke-width="2"/>
  <text x="882" y="92" font-size="14" fill="#0063AC" text-anchor="middle">judge</text>
  <line x1="819" y1="87" x2="843" y2="87" stroke="#0063AC" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M882,104 q0,40 -100,40 q-25,0 -25,-26" fill="none" stroke="#0063AC" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="832" y="158" font-size="13" fill="#5a6b80" text-anchor="middle">improve</text>
  <text x="830" y="222" font-size="20" font-weight="700" fill="#0063AC" text-anchor="middle">EVALUATOR</text>
  <text x="830" y="252" font-size="16" fill="#3b4252" text-anchor="middle">make, judge,</text>
  <text x="830" y="274" font-size="16" fill="#3b4252" text-anchor="middle">then improve</text>
</svg>
