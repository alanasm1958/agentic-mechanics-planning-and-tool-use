<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0063AC"/>
    </marker>
  </defs>

  <!-- Arrows clockwise: Thought -> Action -> Observation -> Thought -->
  <line x1="556" y1="196" x2="650" y2="312" stroke="#0063AC" stroke-width="3" marker-end="url(#r)"/>
  <line x1="624" y1="360" x2="378" y2="360" stroke="#0063AC" stroke-width="3" marker-end="url(#r)"/>
  <line x1="352" y1="312" x2="446" y2="196" stroke="#0063AC" stroke-width="3" marker-end="url(#r)"/>

  <!-- Nodes -->
  <circle cx="500" cy="150" r="66" fill="#e8f1f8" stroke="#0063AC" stroke-width="3"/>
  <text x="500" y="158" font-size="22" font-weight="700" fill="#0063AC" text-anchor="middle">THOUGHT</text>

  <circle cx="690" cy="360" r="66" fill="#e8f1f8" stroke="#0063AC" stroke-width="3"/>
  <text x="690" y="368" font-size="24" font-weight="700" fill="#0063AC" text-anchor="middle">ACTION</text>

  <circle cx="310" cy="360" r="70" fill="#e8f1f8" stroke="#0063AC" stroke-width="3"/>
  <text x="310" y="356" font-size="18" font-weight="700" fill="#0063AC" text-anchor="middle">OBSERVE</text>
  <text x="310" y="378" font-size="13" fill="#2a5a8f" text-anchor="middle">the result</text>

  <!-- Example legend -->
  <text x="500" y="456" font-size="18" fill="#5a6b80" text-anchor="middle">Thought: I need the weather   .   Action: call the weather tool   .   Observation: 18 degrees C and raining</text>
</svg>
