<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0063AC"/>
    </marker>
  </defs>

  <!-- Goal -->
  <rect x="410" y="16" width="180" height="52" rx="12" fill="#0063AC"/>
  <text x="500" y="50" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">GOAL</text>
  <line x1="500" y1="68" x2="500" y2="98" stroke="#0063AC" stroke-width="3" marker-end="url(#ah)"/>

  <!-- Done exit -->
  <line x1="566" y1="168" x2="690" y2="168" stroke="#9aa7bd" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="5 5"/>
  <text x="700" y="174" font-size="18" fill="#6b7a99">done? then stop</text>

  <!-- Arrows clockwise -->
  <line x1="548" y1="214" x2="646" y2="338" stroke="#0063AC" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="624" y1="380" x2="378" y2="380" stroke="#0063AC" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="354" y1="338" x2="452" y2="214" stroke="#0063AC" stroke-width="3" marker-end="url(#ah)"/>

  <!-- Nodes -->
  <circle cx="500" cy="170" r="66" fill="#e8f1f8" stroke="#0063AC" stroke-width="3"/>
  <text x="500" y="178" font-size="24" font-weight="700" fill="#0063AC" text-anchor="middle">PLAN</text>

  <circle cx="690" cy="380" r="66" fill="#e8f1f8" stroke="#0063AC" stroke-width="3"/>
  <text x="690" y="388" font-size="24" font-weight="700" fill="#0063AC" text-anchor="middle">ACT</text>

  <circle cx="310" cy="380" r="66" fill="#e8f1f8" stroke="#0063AC" stroke-width="3"/>
  <text x="310" y="388" font-size="21" font-weight="700" fill="#0063AC" text-anchor="middle">OBSERVE</text>

  <!-- Example legend -->
  <text x="500" y="500" font-size="19" fill="#6b7a99" text-anchor="middle">For a trip: plan = choose a flight, act = book it, observe = read the confirmation</text>
</svg>
