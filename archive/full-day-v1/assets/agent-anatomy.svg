<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <!-- Card 1: Model -->
  <rect x="24" y="24" width="222" height="250" rx="16" fill="#f6f8fc" stroke="#c9d6ef" stroke-width="2"/>
  <rect x="24" y="24" width="222" height="8" rx="4" fill="#0063AC"/>
  <circle cx="135" cy="96" r="32" fill="#e8f1f8" stroke="#0063AC" stroke-width="3"/>
  <path d="M120,96 q15,-20 30,0" fill="none" stroke="#0063AC" stroke-width="3"/>
  <text x="135" y="180" font-size="23" font-weight="700" fill="#0063AC" text-anchor="middle">MODEL</text>
  <text x="135" y="212" font-size="18" fill="#3b4252" text-anchor="middle">the brain that</text>
  <text x="135" y="234" font-size="18" fill="#3b4252" text-anchor="middle">decides</text>

  <!-- Card 2: Tools -->
  <rect x="266" y="24" width="222" height="250" rx="16" fill="#f6f8fc" stroke="#c9d6ef" stroke-width="2"/>
  <rect x="266" y="24" width="222" height="8" rx="4" fill="#0063AC"/>
  <line x1="357" y1="74" x2="397" y2="118" stroke="#0063AC" stroke-width="7" stroke-linecap="round"/>
  <line x1="357" y1="118" x2="397" y2="74" stroke="#0063AC" stroke-width="7" stroke-linecap="round"/>
  <text x="377" y="180" font-size="23" font-weight="700" fill="#0063AC" text-anchor="middle">TOOLS</text>
  <text x="377" y="212" font-size="18" fill="#3b4252" text-anchor="middle">the hands that</text>
  <text x="377" y="234" font-size="18" fill="#3b4252" text-anchor="middle">act</text>

  <!-- Card 3: Memory -->
  <rect x="508" y="24" width="222" height="250" rx="16" fill="#f6f8fc" stroke="#c9d6ef" stroke-width="2"/>
  <rect x="508" y="24" width="222" height="8" rx="4" fill="#0063AC"/>
  <rect x="584" y="68" width="70" height="56" rx="6" fill="#e8f1f8" stroke="#0063AC" stroke-width="3"/>
  <line x1="598" y1="86" x2="640" y2="86" stroke="#0063AC" stroke-width="3"/>
  <line x1="598" y1="100" x2="640" y2="100" stroke="#0063AC" stroke-width="3"/>
  <line x1="598" y1="114" x2="624" y2="114" stroke="#0063AC" stroke-width="3"/>
  <text x="619" y="180" font-size="23" font-weight="700" fill="#0063AC" text-anchor="middle">MEMORY</text>
  <text x="619" y="212" font-size="18" fill="#3b4252" text-anchor="middle">the notebook</text>
  <text x="619" y="234" font-size="18" fill="#3b4252" text-anchor="middle">that remembers</text>

  <!-- Card 4: Loop -->
  <rect x="750" y="24" width="222" height="250" rx="16" fill="#f6f8fc" stroke="#c9d6ef" stroke-width="2"/>
  <rect x="750" y="24" width="222" height="8" rx="4" fill="#0063AC"/>
  <path d="M889,80 A 30,30 0 1 1 855,82" fill="none" stroke="#0063AC" stroke-width="6"/>
  <path d="M889,66 L889,84 L873,80 Z" fill="#0063AC"/>
  <text x="861" y="180" font-size="23" font-weight="700" fill="#0063AC" text-anchor="middle">LOOP</text>
  <text x="861" y="212" font-size="18" fill="#3b4252" text-anchor="middle">the heartbeat</text>
  <text x="861" y="234" font-size="18" fill="#3b4252" text-anchor="middle">that repeats</text>
</svg>
